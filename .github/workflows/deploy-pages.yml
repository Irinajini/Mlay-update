name: Deploy Mlay Service to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest Mlay ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouvé à la racine du dépôt."
            exit 1
          fi

          echo "ZIP détecté : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract website
        shell: bash
        run: |
          rm -rf site
          mkdir -p site

          unzip -q "$ZIP_FILE" -d extracted

          INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERREUR : index.html introuvable dans le ZIP."
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX_FILE")

          echo "Dossier du site : $SITE_DIR"

          cp -R "$SITE_DIR"/. site/

      - name: Ensure 404 fallback
        shell: bash
        run: |
          if [ ! -f "site/404.html" ]; then
            cp site/index.html site/404.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
